name: Remove retired BryGuy branch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-bryguy.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete retired branch
        run: git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete BryGuy
