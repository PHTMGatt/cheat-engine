name: Remove retired BryGuy branch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-bryguy.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete retired branch
        run: git push origin --delete BryGuy
